[package]
name = "necropolis"
description = "Necropolis: a cross-chain graveyard for dead memecoins. Burial registry, resurrection rite and chain-signature vaults on NEAR."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/BoyofMars/necropolis"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["unstable"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
